# 8G+4G was causing swap thrash on GitHub runners; keep local builds comfortable
# without starving the OS. CI can override via GRADLE_OPTS if needed.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=false
android.useAndroidX=true
# Jetifier is off: no dependency in either runtime classpath still ships
# com.android.support / android.arch classes, and no local .aar or .jar is
# bundled, so there is nothing left for it to rewrite. Re-enable only if a
# new dependency reintroduces the legacy support library.
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
